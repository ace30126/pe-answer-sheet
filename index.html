<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기술사 답안지 실습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Hi+Melody&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #d8d4cc; font: 13px 'Nanum Gothic', 'Malgun Gothic', sans-serif; color: #2a2f3a; }
  body.dragging, body.dragging * { user-select: none !important; }

  /* ---------- 도구 막대 ---------- */
  #tb { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 14px; background: #fbfaf7; border-bottom: 1px solid #cfcac0; }
  .brand { font-weight: 700; font-size: 15px; white-space: nowrap; }
  .grp { display: flex; align-items: center; gap: 4px; padding-right: 10px; border-right: 1px solid #e0dbd2; }
  .grp:last-child { border-right: none; }
  .grp > label { color: #7a7f8a; margin-right: 2px; }
  .br { flex-basis: 100%; height: 0; }
  #tb button, #tb select { font: inherit; height: 30px; border: 1px solid #cfc9be; background: #fff; border-radius: 6px; color: #2a2f3a; }
  #tb button { padding: 0 9px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
  #tb button:hover { background: #f1eee8; }
  #tb button.on { background: #24314d; color: #fff; border-color: #24314d; }
  #tb button:disabled { opacity: .4; cursor: default; background: #fff; }
  #tb button.danger { color: #b33a3a; }
  #tb select { padding: 0 6px; }
  #tb svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #sizeRange { width: 70px; }
  #sizeVal, #zoomVal { min-width: 30px; text-align: center; color: #555; }
  .tm { font: 700 16px Consolas, ui-monospace, monospace !important; min-width: 104px; justify-content: center; }
  .tm.run { background: #24314d !important; color: #fff !important; }
  .tm.warn { background: #c0392b !important; color: #fff !important; border-color: #c0392b !important; }
  #info { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 6px 16px; font-size: 12px; color: #555; background: #f3f1ec; border-bottom: 1px solid #ddd8ce; }
  #stat { font-weight: 700; color: #24314d; }
  #info .help { color: #888; }
  #info .note { color: #9a5b12; }

  /* ---------- 답안지 ---------- */
  #stage { padding: 28px 16px 80px; overflow-x: auto; }
  #pages { --hand: 'Gaegu', cursive; --fs: 30px; --ls: 6px; --ink: #1c2230; --paper: #fffefb; --rule: #9aa1aa; width: max-content; margin: 0 auto; }
  .page { position: relative; width: 794px; height: 1123px; padding: 62px 47px 0; background: var(--paper); box-shadow: 0 2px 10px rgba(0,0,0,.18); margin: 0 auto 28px; }
  .pno { position: absolute; top: 34px; right: 47px; font: 15px 'Nanum Myeongjo', serif; color: #333; }
  .pf { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; font: 12px 'Nanum Gothic', sans-serif; color: #9aa1aa; letter-spacing: .2em; }
  .sheet { position: relative; width: 700px; height: calc(22 * 45px + 6px); border: 3px solid #1e1e1e; }
  .rules { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .rules .hl { position: absolute; left: 0; right: 0; height: 1px; background: repeating-linear-gradient(90deg, var(--rule) 0 2px, transparent 2px 4px); }
  .rules .vl { position: absolute; top: 0; bottom: 0; width: 1px; background: repeating-linear-gradient(180deg, var(--rule) 0 2px, transparent 2px 4px); }
  .rules .bh { position: absolute; left: 4px; top: 3px; font: 10px 'Nanum Gothic', sans-serif; color: #6d737b; }
  .mask { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  .mask rect { fill: var(--paper); }
  .rows { position: relative; z-index: 2; }
  .row { position: relative; display: flex; height: 45px; }
  .row:focus-within { background: rgba(255, 228, 130, .2); }
  .cell { outline: none; font-family: var(--hand); font-size: var(--fs); color: var(--ink); line-height: 45px; white-space: pre; }
  .mk { width: 102px; flex: none; padding-left: 4px; overflow: visible; }
  .row:first-child[data-lv="0"] .mk { padding-left: 24px; }
  .row[data-lv="1"] .mk { padding-left: 50px; }
  .row[data-lv="2"] .mk { padding-left: 78px; }
  .row[data-lv] .mk:has(.q) { padding-left: 0; }
  .mk .q { display: inline-block; text-align: center; width: 28px; }
  .mk .q:first-child { width: 46px; }
  .txt { flex: 1; min-width: 0; padding-left: 4px; letter-spacing: var(--ls); }
  .ln { position: absolute; right: -34px; top: 0; width: 28px; font: 11px/45px 'Nanum Gothic', sans-serif; color: #9aa6b6; display: none; }
  body.show-ln .ln { display: block; }

  /* ---------- 그리기 ---------- */
  .draw { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; overflow: visible; pointer-events: none; }
  .vis { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .vis .ah { fill: var(--ink); stroke-width: 1; }
  .vis.dash { stroke-dasharray: 7 6; }
  .vis.dash .ah { stroke-dasharray: none; }
  .hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: move; }
  .it.sel .vis { stroke: #2f6fd6; }
  .it.sel .vis .ah { fill: #2f6fd6; }
  .hd { fill: #fff; stroke: #2f6fd6; stroke-width: 2; pointer-events: all; cursor: crosshair; }
  .labels { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
  .lbl, .lbl-sp { position: absolute; pointer-events: auto; white-space: pre; font-family: var(--hand); font-size: calc(var(--fs) * .8); line-height: 45px; color: var(--ink); padding: 0 3px; min-width: 12px; cursor: move; outline: none; }
  .lbl[data-a="c"], .lbl-sp[data-a="c"] { transform: translateX(-50%); }
  .lbl[contenteditable="true"] { cursor: text; outline: 1.5px dashed #2f6fd6; background: rgba(255,255,255,.7); }
  .lbl.sel, .lbl-sp.sel { outline: 2px dashed #2f6fd6; }
  .lbl[data-ph], .lbl-sp[data-ph] { color: #a7b0bc; }
  .tgrid { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .tcell { position: absolute; pointer-events: auto; cursor: cell; }
  .tcell:hover { background: rgba(47,111,214,.06); }
  .tcell.on { background: rgba(47,111,214,.16); }
  /* 쪽 아래로 넘친 표·개념도: 원래 쪽에서는 잘리고, 다음 쪽 첫 줄부터 이어서 비춰 보인다 */
  .draw, .labels, .tgrid { clip-path: polygon(-80px -60px, calc(100% + 80px) -60px, calc(100% + 80px) 100%, -80px 100%); }
  .spill-d { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; overflow: hidden; }
  .spill-l { position: absolute; inset: 0; z-index: 4; overflow: hidden; }
  .spill-d, .spill-d *, .spill-l, .spill-l * { pointer-events: none !important; }
  .spill-d .sel .vis { stroke: #2f6fd6; }
  .marq { position: absolute; z-index: 8; border: 1.5px dashed #2f6fd6; background: rgba(47,111,214,.08); pointer-events: none; }
  body:not([data-tool="text"]) .sheet { cursor: crosshair; }
  body[data-tool="move"] .sheet { cursor: default; }
  body[data-tool="move"] .lbl { cursor: move; }

  /* ---------- 개념도 패널 ---------- */
  #cdPanel { position: fixed; right: 0; bottom: 0; width: 300px; z-index: 90; display: none; flex-direction: column; background: #f6f4ef; border-left: 1px solid #cfcac0; box-shadow: -4px 0 12px rgba(0,0,0,.08); font-size: 13px; --ink: #1c2230; }
  body.cd-open #cdPanel { display: flex; }
  body.cd-open #stage { padding-right: 316px; }
  #cdPanel .cdh { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; font-weight: 700; border-bottom: 1px solid #ddd8ce; }
  #cdPanel .cdh button { border: none; background: none; font-size: 18px; cursor: pointer; color: #555; }
  #cdList { overflow-y: auto; padding: 10px; }
  .cdc { background: #fff; border: 1px solid #e2ddd3; border-radius: 8px; padding: 8px; margin-bottom: 10px; }
  .cdc h4 { margin: 0 0 6px; font-size: 14px; display: flex; justify-content: space-between; align-items: baseline; }
  .cdc h4 small { font-weight: 400; font-size: 11px; color: #8a8f99; }
  .cdc .th { display: block; width: 100%; height: auto; cursor: pointer; background: #fffefb; border: 1px solid #ece8e0; border-radius: 4px; }
  .cdc .th:hover { outline: 2px solid #2f6fd6; }
  .cdc .th .rl { stroke: #c9ced4; stroke-width: 1; stroke-dasharray: 2 2; }
  .cdc .th text { font: 21px 'Gaegu', cursive; fill: #8a93a0; text-anchor: middle; }
  .cdr { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .cdr button { width: 26px; height: 24px; border: 1px solid #cfc9be; background: #fff; border-radius: 5px; cursor: pointer; }
  .cdr b { min-width: 34px; text-align: center; }
  .cdr span { margin-left: auto; color: #9a9fa8; font-size: 11px; }
  .cdc .tip { margin-top: 4px; color: #6d727b; font-size: 12px; line-height: 1.4; }
  body[data-tool="label"] .sheet { cursor: text; }

  /* ---------- 그림 파일 ---------- */
  .obj { position: absolute; z-index: 5; }
  .obj.sel { outline: 2px dashed #2f6fd6; outline-offset: 3px; z-index: 6; }
  .obj.dragging { z-index: 60; opacity: .88; }
  .obj-body { width: 100%; height: 100%; background: var(--paper); }
  .obj img { display: block; width: 100%; height: 100%; object-fit: contain; cursor: move; user-select: none; -webkit-user-drag: none; }
  .obj.gray img { filter: grayscale(1) contrast(1.2); }
  .obj-bar { position: absolute; left: 0; top: -34px; z-index: 2; display: none; gap: 3px; padding: 3px; background: #24314d; border-radius: 6px; white-space: nowrap; }
  .obj.sel .obj-bar { display: flex; }
  .obj-bar button { height: 24px; padding: 0 8px; border: none; border-radius: 4px; background: #3a4a6e; color: #fff; font: 12px 'Nanum Gothic', sans-serif; cursor: pointer; }
  .obj-bar button[data-act="del"] { background: #b33a3a; }
  .rz { position: absolute; right: -8px; bottom: -8px; width: 14px; height: 14px; background: #2f6fd6; border: 2px solid #fff; border-radius: 3px; cursor: nwse-resize; display: none; }
  .obj.sel .rz { display: block; }
  .obj-lines { position: absolute; top: 0; right: -50px; padding: 2px 6px; border-radius: 10px; background: #2f6fd6; color: #fff; font: 11px 'Nanum Gothic', sans-serif; display: none; }
  .obj.sel .obj-lines, .obj:hover .obj-lines { display: block; }

  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 10px 18px; border-radius: 8px; background: #24314d; color: #fff; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 200; }
  #toast.show { opacity: 1; }

  body.shot .obj-bar, body.shot .rz, body.shot .obj-lines, body.shot .ln, body.shot .hdl, body.shot .tgrid,
  body.shot .lbl[data-ph], body.shot .lbl-sp[data-ph] { display: none !important; }
  body.shot .page { box-shadow: none; margin: 0; }
  body.shot .row:focus-within { background: none; }
  body.shot .draw, body.shot .labels { overflow: hidden; }
  body.shot .rules .hl { background: none; border-top: 1px dotted var(--rule); }
  body.shot .rules .vl { background: none; border-left: 1px dotted var(--rule); }

  @media print {
    @page { size: A4; margin: 0; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { background: #fff; }
    #tb, #info, #toast, #cdPanel { display: none !important; }
    body.cd-open #stage { padding-right: 0; }
    #stage { padding: 0; }
    #pages { zoom: 1 !important; }
    .page { margin: 0; box-shadow: none; break-after: page; }
    .obj-bar, .rz, .obj-lines, .ln, .hdl, .lbl[data-ph], .lbl-sp[data-ph] { display: none !important; }
    .obj.sel, .lbl.sel, .lbl-sp.sel { outline: none; }
    .it.sel .vis, .spill-d .sel .vis { stroke: var(--ink); }
    .it.sel .vis .ah { fill: var(--ink); }
    .row:focus-within { background: none; }
  }
</style>
</head>
<body data-tool="text">

<header id="tb">
  <div class="brand">기술사 답안지</div>
  <div class="grp">
    <label>글씨</label>
    <select id="fontSel" title="글꼴">
      <option value="gaegu">손글씨 (개구)</option>
      <option value="pen">손글씨 (나눔펜)</option>
      <option value="himelody">손글씨 (하이멜로디)</option>
      <option value="myeongjo">명조</option>
      <option value="gothic">고딕</option>
    </select>
    <input type="range" id="sizeRange" min="16" max="42" title="글자 크기">
    <span id="sizeVal"></span>
    <select id="perSel" title="한 줄에 들어가는 글자 수 (띄어쓰기 4개 별도). 자간이 자동으로 맞춰집니다">
      <option value="14">한 줄 14자</option>
      <option value="15">한 줄 15자</option>
      <option value="16">한 줄 16자</option>
      <option value="17">한 줄 17자</option>
      <option value="18">한 줄 18자</option>
    </select>
    <select id="inkSel" title="잉크 색">
      <option value="black">검정</option>
      <option value="blue">파랑</option>
    </select>
  </div>
  <div class="grp">
    <button id="btnEmph" title="선택한 글자를 강조 (밑줄 + 따옴표)"><u>"강조"</u></button>
    <button id="btnClear" title="선택한 글자의 밑줄 지우기">서식 지우기</button>
    <button id="btnEnd" title="현재 줄 끝에 &quot;끝&quot; 쓰기">"끝"</button>
    <button id="btnBlank" title="다음 빈 줄에 이하 여백 쓰기">이하 여백</button>
  </div>
  <div class="grp">
    <button id="btnInsLine" title="현재 줄 위에 빈 줄 (Ctrl+Enter)">줄 삽입</button>
    <button id="btnDelLine" title="현재 줄 지우고 당기기 (Ctrl+Shift+Backspace)">줄 삭제</button>
    <button id="btnAddPage">쪽 추가</button>
    <button id="btnDelPage" title="마지막 쪽 삭제">쪽 삭제</button>
    <button id="btnLn" title="오른쪽 여백에 줄 번호 표시">줄번호</button>
  </div>
  <div class="grp">
    <button id="zOut" title="축소">-</button><span id="zoomVal">100%</span><button id="zIn" title="확대">+</button>
  </div>
  <div class="grp">
    <select id="tmSel" title="타이머 시간">
      <option value="100">1교시 전체 100분</option>
      <option value="10">1교시 1문제 10분</option>
      <option value="25">2~4교시 1문제 25분</option>
      <option value="5">시연 5분</option>
    </select>
    <button id="tmBtn" class="tm">▶ 100:00</button>
    <button id="tmReset" title="타이머 초기화">↺</button>
  </div>
  <div class="grp">
    <button id="btnShot" title="답안지를 사진(PNG)으로 저장">사진 저장</button>
    <button id="btnSave" title="이어 쓸 수 있게 답안 파일(JSON)로 저장. [불러오기]로 다시 엽니다">파일 저장</button>
    <button id="btnLoad" title="저장한 JSON 파일 열기">불러오기</button>
    <input type="file" id="fileJson" accept=".json,application/json" hidden>
    <button id="btnPrint" title="인쇄 또는 PDF로 저장 (A4)">인쇄·PDF</button>
    <button id="btnNew" class="danger">새 답안</button>
  </div>
  <div class="br"></div>
  <div class="grp" id="tools">
    <label>그리기</label>
    <button data-tool="text" class="on" title="글쓰기 (Esc). Shift+드래그하면 직선">글쓰기</button>
    <button data-tool="move" title="이동: 그림·글자를 눌러 끌기, 빈 곳을 끌면 여러 개 선택"><svg viewBox="0 0 20 20"><path d="M7.5 10.5V4.2a1.4 1.4 0 0 1 2.8 0V9.5M10.3 9V3.2a1.4 1.4 0 0 1 2.8 0V9.5M13.1 9.5V5.2a1.4 1.4 0 0 1 2.8 0v6.3a6 6 0 0 1-6 6H9a5 5 0 0 1-4-2l-2.6-3.6a1.3 1.3 0 0 1 2-1.7l3.1 2.8"/></svg></button>
    <button data-tool="line" title="선 (Shift: 수평·수직·45도)"><svg viewBox="0 0 20 20"><line x1="3" y1="17" x2="17" y2="3"/></svg></button>
    <button data-tool="arrow" title="화살표"><svg viewBox="0 0 20 20"><line x1="3" y1="17" x2="16" y2="4"/><polyline points="9,4 16,4 16,11"/></svg></button>
    <button data-tool="darrow" title="양방향 화살표"><svg viewBox="0 0 20 20"><line x1="4" y1="16" x2="16" y2="4"/><polyline points="9,4 16,4 16,11"/><polyline points="4,9 4,16 11,16"/></svg></button>
    <button data-tool="rect" title="네모"><svg viewBox="0 0 20 20"><rect x="3" y="5" width="14" height="10"/></svg></button>
    <button data-tool="round" title="둥근 네모"><svg viewBox="0 0 20 20"><rect x="3" y="5" width="14" height="10" rx="4"/></svg></button>
    <button data-tool="ellipse" title="원"><svg viewBox="0 0 20 20"><ellipse cx="10" cy="10" rx="7.5" ry="6"/></svg></button>
    <button data-tool="tri" title="세모"><svg viewBox="0 0 20 20"><polygon points="10,3 17.5,16 2.5,16"/></svg></button>
    <button data-tool="diamond" title="마름모"><svg viewBox="0 0 20 20"><polygon points="10,2.5 17.5,10 10,17.5 2.5,10"/></svg></button>
    <button data-tool="cyl" title="원통 (DB)"><svg viewBox="0 0 20 20"><ellipse cx="10" cy="5" rx="6" ry="2.5"/><path d="M4 5 V15 A6 2.5 0 0 0 16 15 V5"/></svg></button>
    <button data-tool="label" title="글자: 클릭한 곳에 글자 쓰기 (도형 더블클릭도 가능)"><b style="font-size:15px">가</b></button>
    <button id="btnImg" title="그림 파일 넣기 (Ctrl+V 붙여넣기, 끌어다 놓기도 가능)">그림파일</button>
    <input type="file" id="fileImg" accept="image/*" multiple hidden>
  </div>
  <div class="grp">
    <label>표</label>
    <button data-tpl="t3" title="구분 | 항목 | 설명 (7줄)">3단표</button>
    <button data-tpl="cmp" title="구분 | 토픽A | 토픽B (5줄)">비교표</button>
    <button data-tpl="fig" title="구분 | 그림 | 설명 (7줄)">그림표</button>
    <button id="tAdd" title="고른 칸 아래에 줄 추가 (칸을 안 고르면 맨 아래)">줄+</button>
    <button id="tDel" title="고른 칸이 있는 줄 삭제">줄-</button>
    <button id="tMerge" title="고른 칸들 병합 (Shift+클릭으로 범위 선택)">병합</button>
    <button id="tSplit" title="고른 칸들의 병합 풀기">병합 풀기</button>
  </div>
  <div class="grp">
    <label>개념도</label>
    <button id="btnCd" title="개념도 미리보기 패널 열기·닫기 (커서 다음 줄부터 넣음)">유형 고르기</button>
  </div>
  <div class="grp" id="selGrp">
    <label>선택</label>
    <button id="sDash" title="실선/점선 바꾸기">점선</button>
    <button id="sGroup" title="선택한 것들을 한 묶음으로">묶기</button>
    <button id="sUngroup" title="묶음 풀기 (낱개로 고치기)">풀기</button>
    <button id="sDup" title="복제 (Ctrl+D)">복제</button>
    <button id="sDel" title="삭제 (Delete)">삭제</button>
    <button id="sUndo" title="그리기 되돌리기 (Ctrl+Z)">되돌리기</button>
  </div>
</header>
<aside id="cdPanel"><div class="cdh">개념도 유형<button id="cdClose" title="닫기">×</button></div><div id="cdList"></div></aside>
<div id="info">
  <span id="stat"></span>
  <span id="saveState"></span>
  <span class="note">비공식 실습 도구(Q-Net 공식 아님) · PC 브라우저 전용 · 답안은 이 브라우저에만 저장되니 다른 PC로 옮기거나 보관하려면 [저장]으로 파일을 받아 두세요</span>
  <span class="help">"1. " "가. " "- " 를 치면 번호 칸으로 자동 정렬 · Shift+드래그 직선 · 도형 더블클릭=도형 안에 글자 · Ctrl+드래그 여러 개 선택 · 그림 선택 후 Delete/화살표/Ctrl+D · Ctrl+V 그림 붙여넣기</span>
</div>
<main id="stage"><div id="pages"></div></main>
<div id="toast"></div>

<script>
(() => {
  'use strict';
  const LH = 45, ROWS = 22, MKW = 102, SW = 694, BORDER = 3, KEY = 'pe-answer-sheet-v2';
  const GX = [0, 46, 74, 102, SW];
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const pagesEl = $('#pages');

  const FONTS = {
    gaegu:    { css: "'Gaegu', cursive", size: 30 },
    pen:      { css: "'Nanum Pen Script', cursive", size: 38 },
    himelody: { css: "'Hi Melody', cursive", size: 32 },
    myeongjo: { css: "'Nanum Myeongjo', serif", size: 24 },
    gothic:   { css: "'Nanum Gothic', sans-serif", size: 23 },
  };
  const INKS = { black: '#1c2230', blue: '#1d3c9e' };
  const opt = { font: 'gaegu', size: 30, per: 16, ink: 'black' };
  let zoom = 1, composing = false, lastCell = null, selObj = null, tool = 'text', uid = Date.now() % 100000;
  const newId = () => 'g' + (uid++).toString(36);

  /* ---------- 쪽·줄 ---------- */
  function makePage() {
    const p = document.createElement('section');
    p.className = 'page';
    p.innerHTML = '<div class="pno"></div><div class="sheet"><div class="rules"></div><svg class="mask"></svg>'
      + '<div class="rows"></div><svg class="draw"><g class="items"></g><g class="hdl"></g></svg><div class="labels"></div></div>'
      + '<footer class="pf">연습용 답안지</footer>';
    let h = '<span class="bh">번호</span>';
    for (let i = 1; i < ROWS; i++) h += `<i class="hl" style="top:${i * LH}px"></i>`;
    for (const x of GX.slice(1, 4)) h += `<i class="vl" style="left:${x}px"></i>`;
    $('.rules', p).innerHTML = h;
    const rowsEl = $('.rows', p);
    for (let i = 0; i < ROWS; i++) {
      const r = document.createElement('div');
      r.className = 'row';
      r.dataset.lv = '0';
      r.innerHTML = '<div class="mk cell" contenteditable="true" spellcheck="false"></div>'
        + '<div class="txt cell" contenteditable="true" spellcheck="false"></div>'
        + `<span class="ln">${i + 1}</span>`;
      rowsEl.appendChild(r);
    }
    pagesEl.appendChild(p);
    renumber();
    return p;
  }
  function renumber() { $$('.page').forEach((p, i) => { $('.pno', p).textContent = `${i + 1}쪽`; }); }
  const rows = () => $$('.row');
  const isEmptyRow = r => !$('.mk', r).textContent.trim() && !$('.txt', r).textContent.trim();
  function copyRow(src, dst) { $('.mk', dst).innerHTML = $('.mk', src).innerHTML; dst.dataset.lv = src.dataset.lv; $('.txt', dst).innerHTML = $('.txt', src).innerHTML; }
  function clearRow(r) { $('.mk', r).innerHTML = ''; r.dataset.lv = '0'; $('.txt', r).innerHTML = ''; }
  function shiftDown(idx) {
    let all = rows();
    if (!isEmptyRow(all[all.length - 1])) { makePage(); all = rows(); }
    for (let i = all.length - 1; i > idx; i--) copyRow(all[i - 1], all[i]);
    clearRow(all[idx]);
  }
  function shiftUp(idx) {
    const all = rows();
    for (let i = idx; i < all.length - 1; i++) copyRow(all[i + 1], all[i]);
    clearRow(all[all.length - 1]);
  }
  function ensureNextEmpty(row) {
    let all = rows();
    const i = all.indexOf(row);
    if (i + 1 >= all.length) { makePage(); all = rows(); }
    if (!isEmptyRow(all[i + 1])) { shiftDown(i + 1); all = rows(); }
    return all[i + 1];
  }

  /* ---------- 커서·측정 ---------- */
  function textNodes(el) {
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), a = [];
    let n; while ((n = w.nextNode())) a.push(n);
    return a;
  }
  const len = el => el.textContent.length;
  function pointAt(el, n) {
    for (const t of textNodes(el)) { if (n <= t.length) return [t, n]; n -= t.length; }
    return [el, el.childNodes.length];
  }
  function caretOffset(el) {
    const s = getSelection();
    if (!s.rangeCount) return -1;
    const r = s.getRangeAt(0);
    if (!el.contains(r.endContainer)) return -1;
    const pre = document.createRange();
    pre.selectNodeContents(el);
    pre.setEnd(r.endContainer, r.endOffset);
    return pre.toString().length;
  }
  function setCaret(el, n) {
    el.focus({ preventScroll: true });
    const [node, off] = pointAt(el, Math.max(0, n));
    const r = document.createRange();
    r.setStart(node, off); r.collapse(true);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    el.closest('.row')?.scrollIntoView({ block: 'nearest' });
  }
  function prefixRight(el, n) {
    const ts = textNodes(el);
    const r = document.createRange();
    r.setStart(ts[0], 0);
    const [node, off] = pointAt(el, n);
    r.setEnd(node, off);
    return r.getBoundingClientRect().right;
  }
  const scaleOf = el => (el.getBoundingClientRect().width / el.offsetWidth) || 1;
  // 줄에 들어가는 글자 수. 안 넘치면 -1
  function fitCount(el) {
    const total = len(el);
    if (!total) return -1;
    const lim = el.getBoundingClientRect().right - 3;
    if (prefixRight(el, total) <= lim) return -1;
    let lo = 0, hi = total;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (prefixRight(el, mid) <= lim) lo = mid; else hi = mid - 1;
    }
    return lo;
  }
  function splitPoint(el, k) {
    const t = el.textContent;
    if (/\s/.test(t[k])) return k;
    for (let i = k - 1; i > Math.max(0, k - 8); i--) if (t[i] === ' ') return i + 1;
    return k;
  }
  function stripLead(box) {
    let n = 0;
    for (const t of textNodes(box)) {
      const m = t.data.match(/^\s+/);
      if (!m) { if (t.data.length) break; continue; }
      n += m[0].length;
      t.data = t.data.slice(m[0].length);
      if (t.data.length) break;
    }
    return n;
  }
  // 줄 끝을 넘친 글자를 다음 줄로. 다음 줄에 글이 있으면 빈 줄을 끼워 넣는다
  function reflowFrom(row) {
    let all = rows(), i = all.indexOf(row), guard = 0;
    let caretEl = null, caretN = 0;
    while (i >= 0 && i < all.length && guard++ < 400) {
      const el = $('.txt', all[i]);
      const k = fitCount(el);
      if (k < 0) break;
      const s = splitPoint(el, k);
      if (s <= 0) break;
      const cOff = caretOffset(el);
      const r = document.createRange();
      const [n1, o1] = pointAt(el, s);
      r.setStart(n1, o1); r.setEnd(el, el.childNodes.length);
      const tmp = document.createElement('div');
      tmp.appendChild(r.extractContents());
      const lead = stripLead(tmp);
      const next = ensureNextEmpty(all[i]);
      all = rows();
      const nt = $('.txt', next);
      nt.innerHTML = '';
      while (tmp.firstChild) nt.appendChild(tmp.firstChild);
      if (cOff > s) { caretEl = nt; caretN = Math.max(0, cOff - s - lead); }
      i++;
    }
    if (caretEl) setCaret(caretEl, caretN);
  }
  function reflowAll() { for (let i = 0; i < rows().length; i++) reflowFrom(rows()[i]); }

  /* ---------- 목차 기호 자동 정렬 ---------- */
  // 문1) 답) 1. Ⅰ. → 번호 칸, 가. → 둘째 칸, - → 셋째 칸
  const MARK = '(문\\s?\\d{1,2}\\)|답\\)|\\d{1,2}[.)]|[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]\\.|[IVX]{1,4}\\.|[가-하][.)]|[-·•])';
  const MARK_ONLY = new RegExp('^\\s*' + MARK + '\\s$');
  const MARK_LINE = new RegExp('^\\s*' + MARK + '\\s+(.*)$');
  const levelOf = m => (/^[가-하][.)]$/.test(m) && !/^[문답]/.test(m) ? 1 : /^[-·•]$/.test(m) ? 2 : 0);
  // 문X) 는 세로줄 세 칸에 한 글자씩: "문" 첫째 칸, 번호 둘째 칸, ")" 셋째 칸
  function mkHTML(s) {
    const m = s.replace(/<[^>]*>/g, '').replace(/\s/g, '').match(/^문(\d{1,2})\)$/);
    return m ? `<span class="q">문</span><span class="q">${m[1]}</span><span class="q">)</span>` : s;
  }
  function setMarker(row, m) {
    $('.mk', row).innerHTML = mkHTML(esc(m.replace(/\s/g, '')));
    row.dataset.lv = levelOf(m);
  }
  function autoMarker(row) {
    const t = $('.txt', row);
    if ($('.mk', row).textContent.trim()) return;
    const m = t.textContent.match(MARK_ONLY);
    if (!m) return;
    setMarker(row, m[1]);
    t.innerHTML = '';
    setCaret(t, 0);
  }

  /* ---------- 줄 편집 ---------- */
  function enterSplit(cell) {
    const row = cell.closest('.row');
    const off = caretOffset(cell);
    const tmp = document.createElement('div');
    if (off >= 0 && off < len(cell)) {
      const r = document.createRange();
      const [n, o] = pointAt(cell, off);
      r.setStart(n, o); r.setEnd(cell, cell.childNodes.length);
      tmp.appendChild(r.extractContents());
      stripLead(tmp);
    }
    const next = ensureNextEmpty(row);
    const nt = $('.txt', next);
    nt.innerHTML = '';
    while (tmp.firstChild) nt.appendChild(tmp.firstChild);
    setCaret(nt, 0);
    reflowFrom(next);
    changed();
  }
  function backMerge(row) {
    const all = rows(), i = all.indexOf(row);
    if (i <= 0) return;
    const prev = all[i - 1], pt = $('.txt', prev), ct = $('.txt', row);
    const pos = len(pt);
    if (ct.textContent.trim()) {
      const tmp = document.createElement('div');
      while (ct.firstChild) tmp.appendChild(ct.firstChild);
      stripLead(tmp);
      while (tmp.firstChild) pt.appendChild(tmp.firstChild);
    }
    shiftUp(i);
    setCaret(pt, pos);
    reflowFrom(prev);
    changed();
  }
  function insertLine(row) { const i = rows().indexOf(row); shiftDown(i); setCaret($('.txt', rows()[i]), 0); changed(); }
  function deleteLine(row) { const i = rows().indexOf(row); shiftUp(i); setCaret($('.txt', rows()[i]), 0); changed(); }
  function moveVertical(cell, dir) {
    const all = rows(), i = all.indexOf(cell.closest('.row')) + dir;
    if (i < 0 || i >= all.length) return;
    const target = $(cell.classList.contains('mk') ? '.mk' : '.txt', all[i]);
    const s = getSelection();
    let x = null;
    if (s.rangeCount) { const rr = s.getRangeAt(0).getClientRects(); if (rr.length) x = rr[0].left; }
    target.closest('.row').scrollIntoView({ block: 'nearest' });
    const tr = target.getBoundingClientRect();
    if (x == null) x = tr.left;
    target.focus({ preventScroll: true });
    let r = null;
    if (document.caretRangeFromPoint) r = document.caretRangeFromPoint(x, tr.top + tr.height / 2);
    else if (document.caretPositionFromPoint) {
      const p = document.caretPositionFromPoint(x, tr.top + tr.height / 2);
      if (p) { r = document.createRange(); r.setStart(p.offsetNode, p.offset); }
    }
    if (r && target.contains(r.startContainer)) { r.collapse(true); s.removeAllRanges(); s.addRange(r); }
    else setCaret(target, x > tr.left + 12 ? len(target) : 0);
  }
  function curCell() {
    const s = getSelection();
    if (!s.rangeCount) return null;
    let n = s.anchorNode;
    n = n && n.nodeType === 1 ? n : n && n.parentElement;
    return n ? n.closest('.cell') : null;
  }
  function pasteText(cell, text) {
    const lines = text.replace(/\r\n?/g, '\n').replace(/\t/g, '  ').split('\n');
    if (!cell.classList.contains('txt')) { document.execCommand('insertText', false, lines.join(' ')); return; }
    lines.forEach((ln, i) => {
      if (i > 0) { const c = curCell(); if (c && c.classList.contains('txt')) enterSplit(c); }
      const c = curCell(), row = c && c.closest('.row');
      const m = ln.match(MARK_LINE);
      if (m && row && !$('.mk', row).textContent.trim() && !c.textContent.trim()) { setMarker(row, m[1]); ln = m[2]; }
      if (ln) document.execCommand('insertText', false, ln);
    });
  }

  pagesEl.addEventListener('keydown', e => {
    const cell = e.target.closest && e.target.closest('.cell');
    if (!cell || e.isComposing || e.keyCode === 229) return;
    const row = cell.closest('.row'), isTxt = cell.classList.contains('txt');
    const mk = $('.mk', row), s = getSelection(), collapsed = s.rangeCount && s.getRangeAt(0).collapsed;
    const off = caretOffset(cell);
    if (e.key === 'Enter') {
      e.preventDefault();
      if (e.ctrlKey) insertLine(row);
      else if (!isTxt) setCaret($('.txt', row), 0);
      else enterSplit(cell);
    } else if (e.key === 'Backspace' && e.ctrlKey && e.shiftKey) {
      e.preventDefault(); deleteLine(row);
    } else if (e.key === 'Backspace' && isTxt && collapsed && off === 0) {
      e.preventDefault();
      if (mk.textContent) setCaret(mk, len(mk)); else backMerge(row);
    } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault(); moveVertical(cell, e.key === 'ArrowUp' ? -1 : 1);
    } else if (e.key === 'ArrowLeft' && isTxt && collapsed && off === 0) {
      e.preventDefault(); setCaret(mk, len(mk));
    } else if (e.key === 'ArrowRight' && !isTxt && collapsed && off === len(cell)) {
      e.preventDefault(); setCaret($('.txt', row), 0);
    } else if (e.key === 'Tab') {
      e.preventDefault();
      if (mk.textContent.trim()) { row.dataset.lv = Math.max(0, Math.min(2, +row.dataset.lv + (e.shiftKey ? -1 : 1))); changed(); }
      else if (!isTxt) setCaret($('.txt', row), 0);
      else document.execCommand('insertText', false, '  ');
    }
  });
  pagesEl.addEventListener('beforeinput', e => {
    if (e.target.closest && e.target.closest('.cell') && (e.inputType === 'insertParagraph' || e.inputType === 'insertLineBreak')) e.preventDefault();
  });
  pagesEl.addEventListener('input', e => {
    const t = e.target.closest && e.target.closest('.txt');
    if (t && !e.isComposing && !composing) { autoMarker(t.closest('.row')); reflowFrom(t.closest('.row')); }
    const l = e.target.closest && e.target.closest('.lbl');
    if (l) delete l.dataset.ph;
    changed();
  });
  pagesEl.addEventListener('compositionstart', () => { composing = true; });
  pagesEl.addEventListener('compositionend', e => {
    composing = false;
    const t = e.target.closest && e.target.closest('.txt');
    if (t) setTimeout(() => { if (!composing) reflowFrom(t.closest('.row')); }, 0);
  });
  pagesEl.addEventListener('focusin', e => { const c = e.target.closest && e.target.closest('.cell'); if (c) lastCell = c; });
  pagesEl.addEventListener('focusout', e => {
    const t = e.target.closest && e.target.closest('.txt');
    if (t) setTimeout(() => { if (!composing) reflowFrom(t.closest('.row')); }, 0);
    const l = e.target.closest && e.target.closest('.lbl');
    if (l) {
      l.contentEditable = 'false';
      if (!l.textContent.trim()) { const sh = l.closest('.sheet'); l.remove(); sel.delete(l); if (sh) updateMask(sh); }
      changed();
    }
  });

  /* ---------- 그리기: 선·화살표·도형 ---------- */
  const itemData = g => {
    const d = { t: g.dataset.t };
    for (const k of ['x1', 'y1', 'x2', 'y2']) d[k] = +g.dataset[k];
    if (g.dataset.dash) d.dash = 1;
    if (g.dataset.g) d.g = g.dataset.g;
    if (g.dataset.tb) d.tb = 1;
    if (g.dataset.tm) d.tm = g.dataset.tm;
    return d;
  };
  const f1 = v => Math.round(v * 10) / 10;
  function head(x1, y1, x2, y2) {
    const a = Math.atan2(y2 - y1, x2 - x1), l = 13, w = 5.5;
    const bx = x2 - l * Math.cos(a), by = y2 - l * Math.sin(a), px = -Math.sin(a) * w, py = Math.cos(a) * w;
    return `<polygon class="ah" points="${f1(x2)},${f1(y2)} ${f1(bx + px)},${f1(by + py)} ${f1(bx - px)},${f1(by - py)}"/>`;
  }
  function shapeSVG(d) {
    const { t, x1, y1, x2, y2 } = d;
    const L = Math.min(x1, x2), T = Math.min(y1, y2), W = Math.abs(x2 - x1), H = Math.abs(y2 - y1);
    const line = (a, b, c, e) => `<line x1="${f1(a)}" y1="${f1(b)}" x2="${f1(c)}" y2="${f1(e)}"/>`;
    const trim = (ax, ay, bx, by, k) => { const l = Math.hypot(bx - ax, by - ay) || 1; return [bx - (bx - ax) / l * k, by - (by - ay) / l * k]; };
    switch (t) {
      case 'line': return line(x1, y1, x2, y2);
      case 'arrow': { const [ex, ey] = trim(x1, y1, x2, y2, 8); return line(x1, y1, ex, ey) + head(x1, y1, x2, y2); }
      case 'darrow': {
        const [ex, ey] = trim(x1, y1, x2, y2, 8), [sx, sy] = trim(x2, y2, x1, y1, 8);
        return line(sx, sy, ex, ey) + head(x1, y1, x2, y2) + head(x2, y2, x1, y1);
      }
      case 'rect': return `<rect x="${f1(L)}" y="${f1(T)}" width="${f1(W)}" height="${f1(H)}"/>`;
      case 'round': return `<rect x="${f1(L)}" y="${f1(T)}" width="${f1(W)}" height="${f1(H)}" rx="${f1(Math.min(14, W / 4, H / 4))}"/>`;
      case 'ellipse': return `<ellipse cx="${f1(L + W / 2)}" cy="${f1(T + H / 2)}" rx="${f1(W / 2)}" ry="${f1(H / 2)}"/>`;
      case 'tri': return `<polygon points="${f1(L + W / 2)},${f1(T)} ${f1(L + W)},${f1(T + H)} ${f1(L)},${f1(T + H)}"/>`;
      case 'diamond': return `<polygon points="${f1(L + W / 2)},${f1(T)} ${f1(L + W)},${f1(T + H / 2)} ${f1(L + W / 2)},${f1(T + H)} ${f1(L)},${f1(T + H / 2)}"/>`;
      case 'cyl': {
        const ry = Math.min(10, H / 4), rx = W / 2;
        return `<path d="M${f1(L)} ${f1(T + ry)} a${f1(rx)} ${f1(ry)} 0 1 0 ${f1(W)} 0 a${f1(rx)} ${f1(ry)} 0 1 0 ${f1(-W)} 0 `
          + `M${f1(L)} ${f1(T + ry)} V${f1(T + H - ry)} a${f1(rx)} ${f1(ry)} 0 0 0 ${f1(W)} 0 V${f1(T + ry)}"/>`;
      }
    }
    return '';
  }
  function renderItem(g) {
    const d = itemData(g), s = shapeSVG(d);
    g.innerHTML = `<g class="vis${d.dash ? ' dash' : ''}">${s}</g><g class="hit">${s}</g>`;
  }
  function addItem(sheet, d) {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'it');
    g.dataset.t = d.t;
    for (const k of ['x1', 'y1', 'x2', 'y2']) g.dataset[k] = f1(d[k]);
    if (d.dash) g.dataset.dash = '1';
    if (d.g) g.dataset.g = d.g;
    if (d.tb) g.dataset.tb = '1';
    if (d.tm) g.dataset.tm = d.tm;
    $('.items', sheet).appendChild(g);
    renderItem(g);
    return g;
  }
  function setPts(g, p) { for (const k in p) g.dataset[k] = f1(p[k]); renderItem(g); }

  // 글자(라벨)
  function addLabel(sheet, d) {
    const l = document.createElement('div');
    l.className = 'lbl';
    l.contentEditable = 'false';
    l.spellcheck = false;
    l.innerHTML = d.html || '';
    l.dataset.a = d.a || 'l';
    if (d.ph) l.dataset.ph = '1';
    if (d.g) l.dataset.g = d.g;
    if (d.tb) l.dataset.tb = '1';
    l.style.left = f1(d.x) + 'px';
    l.style.top = f1(d.y) + 'px';
    $('.labels', sheet).appendChild(l);
    return l;
  }
  const labelData = l => {
    const d = { x: parseFloat(l.style.left), y: parseFloat(l.style.top), html: l.innerHTML, a: l.dataset.a };
    if (l.dataset.ph) d.ph = 1;
    if (l.dataset.g) d.g = l.dataset.g;
    if (l.dataset.tb) d.tb = 1;
    return d;
  };
  function editLabel(l) {
    l.contentEditable = 'true';
    l.focus({ preventScroll: true });
    const r = document.createRange();
    r.selectNodeContents(l);
    if (!l.dataset.ph) r.collapse(false);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  function bboxOf(el) {
    if (el.classList.contains('lbl')) {
      const x = parseFloat(el.style.left), y = parseFloat(el.style.top), w = el.offsetWidth;
      const L = el.dataset.a === 'c' ? x - w / 2 : x;
      return [L, y, L + w, y + el.offsetHeight];
    }
    const d = itemData(el);
    return [Math.min(d.x1, d.x2), Math.min(d.y1, d.y2), Math.max(d.x1, d.x2), Math.max(d.y1, d.y2)];
  }

  // 실제 답안지처럼 그림·표 뒤에도 줄선을 그대로 보인다 (예전 저장본의 가림도 지운다)

      // 답안지 테두리 밖으로 나가지 않게
      if (act.xr) dx = Math.max(-act.xr[0], Math.min(SW - act.xr[1], dx));
      if (act.rowSnap) dy = Math.round(dy / LH) * LH;
      else if (act.top != null) {
        const nt = act.top + dy, st = Math.round(nt / LH) * LH;
        if (Math.abs(nt - st) < 7) dy += st - nt;
      } else dy = Math.round(dy / (LH / 2)) * (LH / 2);
      act.orig.forEach((o, el) => {
        if ('l' in o) { el.style.left = o.l + dx + 'px'; el.style.top = o.t + dy + 'px'; }
        else setPts(el, { x1: o.x1 + dx, y1: o.y1 + dy, x2: o.x2 + dx, y2: o.y2 + dy });
      });
      // 끄는 도중에도 쪽을 넘으면 바로 옆 쪽으로 붙이고, 그 자리를 새 기준으로 삼는다
      if (act.rowSnap && fitPage(true)) {
        act.sheet = [...sel][0].closest('.sheet');
        act.p0 = sheetPt(act.sheet, e);
        act.orig = origOf();
      }
      renderHandles(); renderSpill();
    } else if (act.type === 'marquee') {
      const L = Math.min(p.x, act.p0.x), T = Math.min(p.y, act.p0.y);
      Object.assign(act.box.style, { left: L + 'px', top: T + 'px', width: Math.abs(p.x - act.p0.x) + 'px', height: Math.abs(p.y - act.p0.y) + 'px' });

  // 사진 저장: 내용이 있는 쪽까지 그려서 2열로 이어 붙인 PNG 한 장. 인쇄처럼 선택 표시·회색 안내 글자는 뺀다
  const loadShot = () => window.html2canvas ? Promise.resolve() : new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = res; s.onerror = rej;

  const pageUsed = p => $$('.row', p).some(r => !isEmptyRow(r)) || $$('.it, .lbl:not([data-ph]), .obj, .spill-d', p).length > 0;
  $('#btnShot').onclick = async () => {
    toast('사진을 만드는 중입니다…');
    try { await loadShot(); } catch (err) { toast('사진 도구를 불러오지 못했습니다. 인터넷 연결을 확인하세요'); return; }
    blurActive(); clearSel(); selectObj(null); renderSpill();
    const pages = $$('.page');
    let n = 1;
    pages.forEach((p, i) => { if (pageUsed(p)) n = i + 1; });
    const z = pagesEl.style.zoom;
    pagesEl.style.zoom = 1;
    const cs = [];
    try {
      for (const p of pages.slice(0, n)) {
        cs.push(await html2canvas(p, {
          scale: 2, backgroundColor: '#fffefb', logging: false,
          onclone: doc => {
            doc.body.classList.add('shot');
            // 그림은 SVG를 따로 그리므로 스타일시트 색·굵기를 속성으로 박아 둔다
            doc.querySelectorAll('.draw *, .spill-d *').forEach(el => {
              const c = doc.defaultView.getComputedStyle(el);
              el.setAttribute('style', `fill:${c.fill};stroke:${c.stroke};stroke-width:${c.strokeWidth};stroke-dasharray:${c.strokeDasharray}`);
            });
          },
        }));
      }
    } finally { pagesEl.style.zoom = z; }
    // 2열로 1·2쪽, 3·4쪽… 순서대로 놓는다
    const gap = 40, cols = Math.min(2, cs.length), W = cs[0].width, H = cs[0].height, out = document.createElement('canvas');
    out.width = W * cols + gap * (cols - 1);
    out.height = H * Math.ceil(cs.length / cols) + gap * (Math.ceil(cs.length / cols) - 1);
    const cx = out.getContext('2d');
    cx.fillStyle = '#d8d4cc'; cx.fillRect(0, 0, out.width, out.height);
    cs.forEach((c, i) => cx.drawImage(c, (i % cols) * (W + gap), Math.floor(i / cols) * (H + gap)));
    out.toBlob(blob => {
      const a = document.createElement('a'), d = new Date(), p = k => String(k).padStart(2, '0');
      a.href = URL.createObjectURL(blob);
      a.download = `답안지_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast(`${n}쪽을 사진으로 저장했습니다`);
    }, 'image/png');
  };

  let toastT = null;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
  }
